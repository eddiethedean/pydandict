name: Checks

on:
  workflow_call:
    inputs:
      require_package:
        description: Require the production package metadata (used by releases)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Markdown links and examples
        run: python tools/check_docs.py

  compatibility:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.11'}
          - {os: macos-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.11'}
          - {os: windows-latest, python-version: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run lint and format checks
        run: |
          ruff check src tests tools/check_typing.py tools/qualify_package.py tools/benchmark.py
          ruff format --check src tests tools/check_typing.py tools/qualify_package.py tools/benchmark.py

      - name: Run package tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests -q

      - name: Run strict typing checks
        run: python tools/check_typing.py

      - name: Verify installed public completeness
        run: python -m pyright --verifytypes pydandict --ignoreexternal

  qualification:
    name: Production artifact qualification (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install qualification tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Build and qualify clean artifacts
        run: python tools/qualify_package.py

      - name: Produce benchmark report
        run: python tools/benchmark.py > benchmark.json

  package:
    name: Production package preflight
    # Release calls this reusable workflow with require_package=true.
    if: ${{ inputs.require_package }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate production package metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if metadata["name"] != "pydandict":
              raise SystemExit(
                  f"Production release metadata must name pydandict, got {metadata['name']!r}"
              )
          if not Path("src/pydandict").is_dir():
              raise SystemExit("Production releases require src/pydandict")
          PY

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"

      - name: Run production tests
        run: python -m pytest -q
