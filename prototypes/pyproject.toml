[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydandict-prototype"
version = "0.1.0.dev0"
description = "Local feasibility experiment, not a supported Pydandict release"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[tool.setuptools.packages.find]
include = ["pydandict_prototype*"]

[tool.setuptools.package-data]
pydandict_prototype = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
