[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydandict"
version = "0.1.0"
description = "Pydantic models with validated mapping semantics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pydandict contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
dev = [
  "build",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "hypothesis",
  "pyright==1.1.411",
  "pytest",
  "ruff",
  "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydandict = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src/pydandict/__init__.py", "tests/typing_positive.py"]
exclude = ["tests/typing_negative.py"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
